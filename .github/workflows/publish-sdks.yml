name: Publish SDKs

# All SDK publishing is managed by this workflow only.
# Triggers:
#   1. GitHub Release published (from release.yml or manual release)
#   2. Manual "Run workflow" (workflow_dispatch)
#   3. Reusable workflow_call from other workflows
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      sdks:
        description: 'SDKs to publish (comma-separated: js,python,rust,ruby,java,dotnet,php or "all")'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      sdks:
        description: 'SDKs to publish (comma-separated or all)'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      CRATES_IO_TOKEN:
        required: false
      RUBYGEMS_API_KEY:
        required: false
      NUGET_API_KEY:
        required: false
      OSSRH_USERNAME:
        required: false
      OSSRH_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sdks-${{ github.event.inputs.version || github.event.release.tag_name || inputs.version || github.run_id }}
  cancel-in-progress: false

env:
  # Prefer dispatch/call inputs; fall back to release tag
  VERSION: ${{ github.event.inputs.version || inputs.version || github.event.release.tag_name }}
  DRY_RUN: ${{ github.event.inputs.dry_run || inputs.dry_run || false }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      publish_js: ${{ steps.sdks.outputs.js }}
      publish_python: ${{ steps.sdks.outputs.python }}
      publish_rust: ${{ steps.sdks.outputs.rust }}
      publish_ruby: ${{ steps.sdks.outputs.ruby }}
      publish_java: ${{ steps.sdks.outputs.java }}
      publish_dotnet: ${{ steps.sdks.outputs.dotnet }}
      publish_php: ${{ steps.sdks.outputs.php }}
    steps:
      - name: Get version
        id: version
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version provided (set workflow input or publish a release tag)"
            exit 1
          fi
          DRY_RUN="${{ env.DRY_RUN }}"
          # Normalize boolean strings
          if [ "$DRY_RUN" = "true" ] || [ "$DRY_RUN" = "True" ]; then
            DRY_RUN=true
          else
            DRY_RUN=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION (dry_run=$DRY_RUN)"

      - name: Determine SDKs to publish
        id: sdks
        run: |
          SDKS="${{ github.event.inputs.sdks || inputs.sdks || 'all' }}"
          if [ "$SDKS" = "all" ]; then
            echo "js=true" >> $GITHUB_OUTPUT
            echo "python=true" >> $GITHUB_OUTPUT
            echo "rust=true" >> $GITHUB_OUTPUT
            echo "ruby=true" >> $GITHUB_OUTPUT
            echo "java=true" >> $GITHUB_OUTPUT
            echo "dotnet=true" >> $GITHUB_OUTPUT
            echo "php=true" >> $GITHUB_OUTPUT
          else
            echo "js=$(echo "$SDKS" | grep -q 'js' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "python=$(echo "$SDKS" | grep -q 'python' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "rust=$(echo "$SDKS" | grep -q 'rust' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "ruby=$(echo "$SDKS" | grep -q 'ruby' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "java=$(echo "$SDKS" | grep -q 'java' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "dotnet=$(echo "$SDKS" | grep -q 'dotnet' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "php=$(echo "$SDKS" | grep -q 'php' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          fi

  # JavaScript/TypeScript SDK -> npm (pipeops-rexec)
  publish-js:
    needs: setup
    if: needs.setup.outputs.publish_js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Update version
        run: npm version ${{ needs.setup.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish to npm
        if: needs.setup.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          # Skip if this version is already published
          if npm view "pipeops-rexec@${{ needs.setup.outputs.version }}" version 2>/dev/null; then
            echo "pipeops-rexec@${{ needs.setup.outputs.version }} already on npm — skipping"
            exit 0
          fi
          npm publish --access public

      - name: Dry run
        if: needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would publish pipeops-rexec@${{ needs.setup.outputs.version }} to npm"
          npm pack --dry-run

  # Python SDK -> PyPI (pipeops-rexec)
  publish-python:
    needs: setup
    if: needs.setup.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Update version
        run: |
          sed -i "s/version = \".*\"/version = \"${{ needs.setup.outputs.version }}\"/" pyproject.toml

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        if: needs.setup.outputs.dry_run != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "::error::PYPI_TOKEN secret is not set"
            exit 1
          fi
          # Skip if already published
          if curl -fsS "https://pypi.org/pypi/pipeops-rexec/${{ needs.setup.outputs.version }}/json" >/dev/null 2>&1; then
            echo "pipeops-rexec==${{ needs.setup.outputs.version }} already on PyPI — skipping"
            exit 0
          fi
          twine upload --verbose dist/*

      - name: Dry run
        if: needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would publish pipeops-rexec==${{ needs.setup.outputs.version }} to PyPI"
          twine check dist/*

  # Rust SDK -> crates.io (pipeops-rexec) via CRATES_IO_TOKEN
  publish-rust:
    needs: setup
    if: needs.setup.outputs.publish_rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.setup.outputs.version }}\"/" Cargo.toml

      - name: Check package
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        if: needs.setup.outputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CRATES_IO_TOKEN secret is not set"
            exit 1
          fi
          # Skip if already published
          if cargo search pipeops-rexec --limit 1 2>/dev/null | grep -q "pipeops-rexec = \"${{ needs.setup.outputs.version }}\""; then
            echo "pipeops-rexec@${{ needs.setup.outputs.version }} already on crates.io — skipping"
            exit 0
          fi
          # cargo publish fails with "already uploaded" on re-run; treat as success
          set +e
          OUT=$(cargo publish --allow-dirty 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -qiE 'already exists|already uploaded|crate version .* already'; then
            echo "Version already on crates.io — treating as success"
            exit 0
          fi
          exit $STATUS

      - name: Dry run
        if: needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would publish pipeops-rexec@${{ needs.setup.outputs.version }} to crates.io"
          cargo package --list --allow-dirty

  # Ruby SDK -> RubyGems (pipeops-rexec)
  publish-ruby:
    needs: setup
    if: needs.setup.outputs.publish_ruby == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ruby
    steps:
      - uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Update version
        run: |
          sed -i "s/spec.version = \".*\"/spec.version = \"${{ needs.setup.outputs.version }}\"/" rexec.gemspec

      - name: Build gem
        run: gem build rexec.gemspec

      - name: Publish to RubyGems
        if: needs.setup.outputs.dry_run != 'true'
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RUBYGEMS_API_KEY:-}" ]; then
            echo "::error::RUBYGEMS_API_KEY secret is not set"
            exit 1
          fi
          mkdir -p ~/.gem
          echo -e "---\n:rubygems_api_key: ${RUBYGEMS_API_KEY}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          set +e
          OUT=$(gem push "pipeops-rexec-${{ needs.setup.outputs.version }}.gem" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -qiE 'already been pushed|Repushing of gem versions is not allowed'; then
            echo "Gem already on RubyGems — treating as success"
            exit 0
          fi
          exit $STATUS

      - name: Dry run
        if: needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would publish pipeops-rexec-${{ needs.setup.outputs.version }}.gem to RubyGems"
          ls -la *.gem

  # Java SDK -> Maven Central via Sonatype Central Publisher Portal
  # https://central.sonatype.org/publish/publish-portal-maven/
  publish-java:
    needs: setup
    if: needs.setup.outputs.publish_java == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        id: secrets
        env:
          # Prefer CENTRAL_* names; accept legacy OSSRH_* aliases
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${CENTRAL_USERNAME:-}" ] || [ -z "${CENTRAL_TOKEN:-}" ] || [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Maven Central secrets not configured — skipping Java publish"
            echo "Required: CENTRAL_USERNAME (or OSSRH_USERNAME), CENTRAL_TOKEN (or OSSRH_TOKEN), GPG_PRIVATE_KEY, GPG_PASSPHRASE"
            echo "See docs/SDK_PUBLISHING.md § Maven Central"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java + Maven Central credentials
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # Matches <publishingServerId>central</publishingServerId> in pom.xml
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Update version
        if: steps.secrets.outputs.configured == 'true'
        run: |
          mvn -B versions:set -DnewVersion=${{ needs.setup.outputs.version }} -DgenerateBackupPoms=false

      - name: Build (skip GPG unless publishing)
        if: steps.secrets.outputs.configured == 'true'
        run: mvn -B clean package -DskipTests

      - name: Publish to Maven Central
        if: steps.secrets.outputs.configured == 'true' && needs.setup.outputs.dry_run != 'true'
        run: mvn -B deploy -P release -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Dry run
        if: steps.secrets.outputs.configured == 'true' && needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would deploy io.pipeops:rexec:${{ needs.setup.outputs.version }} to Maven Central"
          ls -la target/*.jar 2>/dev/null || true

  # .NET SDK -> NuGet (PipeOps.Rexec)
  publish-dotnet:
    needs: setup
    if: needs.setup.outputs.publish_dotnet == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Update version
        run: |
          sed -i "s/<Version>.*<\/Version>/<Version>${{ needs.setup.outputs.version }}<\/Version>/" Rexec.csproj

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build -o ./nupkg

      - name: Publish to NuGet
        if: needs.setup.outputs.dry_run != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY secret is not set"
            exit 1
          fi
          set +e
          OUT=$(dotnet nuget push ./nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          exit $STATUS

      - name: Dry run
        if: needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would publish PipeOps.Rexec.${{ needs.setup.outputs.version }}.nupkg to NuGet"
          ls -la ./nupkg/

  # PHP SDK -> Packagist via dedicated repo PipeOpsHQ/rexec-php (synced + tagged)
  publish-php:
    needs: setup
    if: needs.setup.outputs.publish_php == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-dev --no-interaction

      - name: Sync version in composer.json
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          if command -v jq >/dev/null 2>&1; then
            jq --arg v "$VERSION" '.version = $v' composer.json > composer.json.tmp
            mv composer.json.tmp composer.json
          else
            sed -i.bak -E "s/\"version\"[[:space:]]*:[[:space:]]*\"[^\"]+\"/\"version\": \"$VERSION\"/" composer.json
            rm -f composer.json.bak
          fi
          grep -E '"version"' composer.json || true

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Syntax check
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Push to PipeOpsHQ/rexec-php and tag
        if: needs.setup.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          VERSION="${VERSION#v}"
          TOKEN="${{ secrets.SDK_PUSH_TOKEN || secrets.PHP_SDK_PUSH_TOKEN || secrets.GO_SDK_PUSH_TOKEN || secrets.GITHUB_TOKEN }}"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          mkdir -p /tmp/rexec-php
          rsync -a --exclude vendor --exclude .git . /tmp/rexec-php/
          if [ -f "$GITHUB_WORKSPACE/LICENSE" ] && [ ! -f /tmp/rexec-php/LICENSE ]; then
            cp "$GITHUB_WORKSPACE/LICENSE" /tmp/rexec-php/LICENSE
          fi

          git clone "https://x-access-token:${TOKEN}@github.com/PipeOpsHQ/rexec-php.git" /tmp/rexec-php-repo
          rsync -a --delete --exclude .git /tmp/rexec-php/ /tmp/rexec-php-repo/
          cd /tmp/rexec-php-repo

          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "chore: release v${VERSION} from monorepo ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on rexec-php"
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            gh release create "v${VERSION}" \
              --repo PipeOpsHQ/rexec-php \
              --title "v${VERSION}" \
              --notes "Install: \`composer require pipeopshq/rexec:${VERSION}\`" \
              || true
          fi
          echo "Packagist auto-updates from https://github.com/PipeOpsHQ/rexec-php (submit once if not registered)."

      - name: Dry run note
        if: needs.setup.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would sync sdk/php → PipeOpsHQ/rexec-php and tag v${{ needs.setup.outputs.version }}"

  # Go SDK is published via the standalone repo github.com/PipeOpsHQ/rexec-go
  # (synced by sync-go-sdk.yml). Tag releases there for module versions.

  summary:
    needs: [setup, publish-js, publish-python, publish-rust, publish-ruby, publish-java, publish-dotnet, publish-php]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## SDK Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ needs.setup.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| SDK | Registry | Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript | npm | \`pipeops-rexec\` | ${{ needs.publish-js.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | PyPI | \`pipeops-rexec\` | ${{ needs.publish-python.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust | crates.io | \`pipeops-rexec\` | ${{ needs.publish-rust.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruby | RubyGems | \`pipeops-rexec\` | ${{ needs.publish-ruby.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | Maven Central | \`io.pipeops:rexec\` | ${{ needs.publish-java.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| .NET | NuGet | \`PipeOps.Rexec\` | ${{ needs.publish-dotnet.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP | Packagist | \`pipeopshq/rexec\` | ${{ needs.publish-php.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go | GitHub | \`github.com/PipeOpsHQ/rexec-go\` | via sync-go-sdk |" >> $GITHUB_STEP_SUMMARY
